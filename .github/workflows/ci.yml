# CI matrix for cctx
#
# WHY TWO JOBS:
#
# test-macos (default features — full Keychain stack)
#   Runs with default features, which enables the `real-keychain` feature gate
#   and pulls in `security-framework` + `core-foundation`. These crates are
#   macOS-only (arch §6), so the macOS runner is the only place where the full
#   credential backend can be compiled and tested.
#
# test-linux-no-default (feature-gate canary per issue 0.5)
#   Runs with `--no-default-features` on Ubuntu to prove that
#   `security-framework` and `core-foundation` are correctly declared as
#   `optional = true` behind the `real-keychain` feature. If either crate
#   transitively appears without the feature flag, the Linux job fails —
#   that is exactly the canary behavior we want. This validates the feature
#   gate before any future Linux or Windows backend lands (P2).
#
# WHY --skip ignored:
#   Real-Keychain integration tests are annotated with `#[ignore]` and require
#   the environment variable `CCTX_REAL_KEYCHAIN=1` to opt in. They depend on
#   an interactive macOS session where `SecurityAgent` can present Keychain
#   access dialogs. CI runners cannot satisfy that requirement, so we skip them
#   with `-- --skip ignored`.

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  test-macos:
    name: test-macos (default features)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: build
        run: cargo build

      - name: test
        run: cargo test -- --skip ignored

  test-linux-no-default:
    name: test-linux-no-default (feature-gate canary)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets --no-default-features -- -D warnings

      - name: build
        run: cargo build --no-default-features

      - name: test
        run: cargo test --no-default-features -- --skip ignored
