[package]
name = "claude-code-context-switcher"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Switch Claude Code authentication identities from the command line."
license = "MIT OR Apache-2.0"
repository = "https://github.com/rootwarp/claude-code-context-switcher"

[[bin]]
name = "cctx"
path = "src/main.rs"

[features]
default = ["real-keychain"]
real-keychain = ["dep:security-framework", "dep:core-foundation"]

[dependencies]
clap = { version = "=4.6.1", features = ["derive"] }
clap_complete = "=4.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "=0.10.0"
indexmap = { version = "2", features = ["serde"] }
thiserror = "1"
anyhow = "1"
tracing = "=0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tempfile = "=3.27.0"
etcetera = "=0.11.0"
fs2 = "0.4"
zeroize = { version = "1", features = ["zeroize_derive"] }
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
url = { version = "2", features = ["serde"] }
security-framework = { version = "=3.7.0", optional = true }
core-foundation = { version = "0.10", optional = true }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
proptest = "1"
tempfile = "3"
